<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色测试页面</title>
    <style>
        :root {
            --dark-bg: #090712;
            --primary-color: #FFA826;
            --text-color: #FFF9F5;
        }
        
        body {
            font-family: 'Poppins', 'Microsoft YaHei', sans-serif;
            background-color: var(--dark-bg) !important;
            color: var(--text-color) !important;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .color-test {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 168, 38, 0.1);
        }
        
        .primary-text {
            color: var(--primary-color);
        }
        
        .normal-text {
            color: var(--text-color);
        }
        
        .secondary-text {
            color: rgba(255, 249, 245, 0.8);
        }
        
        .test-button {
            background-color: var(--primary-color);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        .test-button:hover {
            background-color: #e89518;
        }
        
        .color-info {
            background-color: rgba(255, 168, 38, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .color-swatch {
            display: inline-block;
            width: 50px;
            height: 30px;
            border-radius: 5px;
            margin: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .swatch-dark-bg { background-color: var(--dark-bg); }
        .swatch-primary { background-color: var(--primary-color); }
        .swatch-text { background-color: var(--text-color); }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="primary-text">颜色测试页面</h1>
        <p class="normal-text">这个页面用于测试网站的颜色主题是否正确显示。</p>
        
        <div class="color-info">
            <h3>当前颜色主题：</h3>
            <p><strong>深色背景：</strong> <span class="color-swatch swatch-dark-bg"></span> #090712</p>
            <p><strong>主要颜色：</strong> <span class="color-swatch swatch-primary"></span> #FFA826</p>
            <p><strong>文字颜色：</strong> <span class="color-swatch swatch-text"></span> #FFF9F5</p>
        </div>
        
        <div class="color-test">
            <h2 class="primary-text">主要颜色文字</h2>
            <p class="normal-text">这是正常的文字颜色，应该是浅色（#FFF9F5）。</p>
            <p class="secondary-text">这是次要文字颜色，应该是半透明的浅色。</p>
        </div>
        
        <div class="color-test">
            <h3>按钮测试</h3>
            <button class="test-button">主要按钮</button>
            <button class="test-button" style="background-color: transparent; border: 1px solid var(--primary-color); color: var(--primary-color);">边框按钮</button>
        </div>
        
        <div class="color-test">
            <h3>链接测试</h3>
            <a href="#" style="color: var(--primary-color); text-decoration: none;">这是一个链接</a>
            <br>
            <a href="#" style="color: var(--text-color); text-decoration: none;">这是另一个链接</a>
        </div>
        
        <div class="color-test">
            <h3>状态检查</h3>
            <p id="status">正在检查颜色状态...</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');
            const body = document.body;
            const computedStyle = window.getComputedStyle(body);
            
            const backgroundColor = computedStyle.backgroundColor;
            const color = computedStyle.color;
            
            // 检查背景色
            const expectedBg = 'rgb(9, 7, 18)'; // #090712
            const expectedColor = 'rgb(255, 249, 245)'; // #FFF9F5
            
            let statusText = '';
            
            if (backgroundColor === expectedBg) {
                statusText += '✅ 背景色正确<br>';
            } else {
                statusText += '❌ 背景色错误: ' + backgroundColor + '<br>';
            }
            
            if (color === expectedColor) {
                statusText += '✅ 文字颜色正确<br>';
            } else {
                statusText += '❌ 文字颜色错误: ' + color + '<br>';
            }
            
            status.innerHTML = statusText;
        });
    </script>
</body>
</html>
